services:
  - type: web
    name: upload-ai-api
    env: node
    buildCommand: pnpm install && pnpm --filter ./apps/api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
